# This is a basic CipherCaller configuration file.
#
# "Default" values refer to values assumed by the program if the relevant key is missing from the configuration file.
# For further guidance, please visit the project wiki https://github.com/Tombuster/CipherCaller/wiki

input:
  method: file  # [microphone, file]. Operation mode. Default value is "file"
  file_path: media/input/example.wav  # Input file path for "file" mode

output:
  method: file  # [file, playback, both]. Operation mode. Default value is "file"
  file_path: media/output/example.wav  # Output file path for "file" and "both" modes

benchmarking:  # Measurements will apprear in Ciphercaller/measurements
  log_timestamps: yes  # [yes, no]

pyaudio:  # Microphone input parameters
  chunk_size: 1024  # how many audio frames are sent in each datagram, cipher block etc.
  channels: 1
  rate: 44100
  sample_width_bytes: 2 # [1, 2, 4]. Corresponds to 8b, 16b and 32b integers. Value of 3 is technically supported, though reading a file results in mostly noise...

sockets:
  receiver_host: receiver  # Docker SERVICE name. Change to IPv4 address for remote deployment
  # receiver_address:  # Address supplied to receiver's socket.bind() command; Default is ""
  port: 2004
  sender_delay_ms: 1000  # Delay before streaming starts, used to let receiver socket bind
  receiver_timeout_ms: 10000  # Denotes the delay between receiving a datagram and breaking the receiving loop. Must exceed sender startup time

# jack:  # might be needed

logging:
  level: INFO

plugin:
  # Plugin configuration
  # When creating your own plugin, you can include its keys in this section
  use_plugin: yes  # [yes, no]. Default value is "no"
  name: simple-aes-psk  # Name of Python file containing desired plugin. MUST be in the src/plugins/ directory!
  config_path: src/plugins/plugin-config/simple-aes-psk.yaml

debug:
  sender_output_stream_to_file: no # [yes, no] NOTE: Needs permissions in docker-compose.yaml!
  sender_output_file_path: media/output/sender_output.wav